name: Release binaries


# Builds standalone Shipout Go binaries and publishes them to GitHub Releases.
# Trigger: push a version tag, e.g. git tag v0.3.0 && git push origin v0.3.0


on:
  push:
    tags:
      - 'v*'


permissions:
  contents: write


jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'


      - name: Build Go binaries
        working-directory: go
        run: |
          GOOS=linux GOARCH=amd64 go build -o ../dist-bin/shipout-linux-x64 .
          GOOS=darwin GOARCH=arm64 go build -o ../dist-bin/shipout-macos-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o ../dist-bin/shipout-macos-x64 .
          GOOS=windows GOARCH=amd64 go build -o ../dist-bin/shipout-win-x64.exe .
          ls -la ../dist-bin/


      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" dist-bin/* --clobber
